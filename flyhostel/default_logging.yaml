version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
loggers:
  imgstore.stores.utils.formats:
    level: WARNING
    handlers: [console]
    propagate: no
  flyhostel.data:
    level: WARNING
    handlers: [console]
    propagate: no
  flyhostel.utils.utils:
    level: WARNING
    handlers: [console]
    propagate: no
  flyhostel.data.interactions.main:
    level: INFO
    handlers: [console]
  sleap_integration:
    level: DEBUG
    handlers: [console]
root:
  level: WARNING
  handlers: [console]